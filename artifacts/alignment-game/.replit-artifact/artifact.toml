kind = "web"
previewPath = "/"
title = "AI Alignment: The Crisis"
version = "1.0.0"
id = "artifacts/alignment-game"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20718

[services.development]
run = "pnpm --filter @workspace/alignment-game run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alignment-game", "run", "build" ]
publicDir = "artifacts/alignment-game/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20718"
BASE_PATH = "/"
